<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloud Task Board</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <h1>Cloud Task Board</h1>
        <p class="app__subtitle">A tiny full-stack demo running in a Cursor Cloud Agent environment.</p>
      </header>

      <form id="new-task-form" class="task-form">
        <input
          id="task-input"
          class="task-form__input"
          type="text"
          placeholder="What needs doing?"
          autocomplete="off"
          required
        />
        <button class="task-form__button" type="submit">Add task</button>
      </form>

      <section>
        <ul id="task-list" class="task-list" aria-live="polite"></ul>
        <p id="empty-state" class="empty-state" hidden>No tasks yet. Add your first one above.</p>
      </section>
    </main>

    <script src="./app.js" type="module"></script>
  </body>
</html>
